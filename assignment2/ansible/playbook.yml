---
- name: Create the GCP instance
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/main.yml
  collections:
    - google.cloud
  tasks:
    - name: Ensure the application VM exists
      google.cloud.gcp_compute_instance:
        auth_kind: application
        name: "{{ instance_name }}"
        project: "{{ project_id }}"
        zone: "{{ zone }}"
        machine_type: "{{ machine_type }}"
        disks:
          - auto_delete: true
            boot: true
            initialize_params:
              source_image: projects/debian-cloud/global/images/family/debian-12
        network_interfaces:
          - network:
              name: default
            access_configs:
              - name: External NAT
                type: ONE_TO_ONE_NAT
        labels:
          course: csci644
          assignment: assignment2
          owner: andychen
        state: present
      register: gcp_instance

    - name: Add the Assignment 2 HTTP network tag
      ansible.builtin.command: >-
        gcloud compute instances add-tags {{ instance_name }}
        --project={{ project_id }} --zone={{ zone }}
        --tags=assignment2-http
      register: add_http_tag
      changed_when: "'Updated' in add_http_tag.stdout"

    - name: Check for the Assignment 2 HTTP firewall rule
      ansible.builtin.command: >-
        gcloud compute firewall-rules describe assignment2-allow-http
        --project={{ project_id }}
      register: http_firewall
      changed_when: false
      failed_when: false

    - name: Create the Assignment 2 HTTP firewall rule
      ansible.builtin.command: >-
        gcloud compute firewall-rules create assignment2-allow-http
        --project={{ project_id }} --network=default
        --direction=INGRESS --action=ALLOW --rules=tcp:80
        --source-ranges=0.0.0.0/0 --target-tags=assignment2-http
      when: http_firewall.rc != 0

    - name: Initialize gcloud SSH access and generate the local key if needed
      ansible.builtin.command: >-
        gcloud compute ssh {{ ssh_user }}@{{ instance_name }}
        --project={{ project_id }} --zone={{ zone }} --command=true
        --quiet
      changed_when: false

    - name: Add the VM to the deployment inventory
      add_host:
        name: target_vm
        groups: target
        ansible_host: "{{ gcp_instance.networkInterfaces[0].accessConfigs[0].natIP }}"
        ansible_user: "{{ ssh_user }}"
        ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/google_compute_engine"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

- name: Deploy the microservice application
  hosts: target
  become: true
  gather_facts: true
  vars_files:
    - vars/main.yml
  tasks:
    - name: Install operating system dependencies
      ansible.builtin.apt:
        name:
          - git
          - nginx
          - nodejs
          - npm
          - python3
          - python3-pip
          - python3-venv
          - redis-server
          - gnupg
          - curl
        state: present
        update_cache: true

    - name: Add MongoDB signing key
      ansible.builtin.get_url:
        url: https://pgp.mongodb.com/server-7.0.asc
        dest: /usr/share/keyrings/mongodb-server-7.0.asc
        mode: '0644'

    - name: Configure MongoDB repository
      ansible.builtin.apt_repository:
        repo: deb [ signed-by=/usr/share/keyrings/mongodb-server-7.0.asc ] https://repo.mongodb.org/apt/debian bookworm/mongodb-org/7.0 main
        filename: mongodb-org-7.0
        state: present

    - name: Install MongoDB
      ansible.builtin.apt:
        name: mongodb-org
        state: present
        update_cache: true

    - name: Create application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        home: /home/microservice
        shell: /usr/sbin/nologin

    - name: Check whether application checkout exists
      ansible.builtin.stat:
        path: "{{ app_dir }}/.git"
      register: application_git

    - name: Remove incomplete application checkout
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: absent
      when: not application_git.stat.exists

    - name: Allow Ansible to manage the application checkout
      ansible.builtin.command: git config --system --add safe.directory "{{ app_dir }}"
      changed_when: false

    - name: Checkout application source
      ansible.builtin.git:
        repo: "{{ app_repo }}"
        dest: "{{ app_dir }}"
        version: main
        force: false

    - name: Set application directory ownership
      ansible.builtin.file:
        path: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        recurse: true

    - name: Install Python dependencies in a virtual environment
      ansible.builtin.pip:
        requirements: "{{ app_dir }}/QuoteService/requirements.txt"
        virtualenv: "{{ app_dir }}/QuoteService/venv"
        virtualenv_command: python3 -m venv

    - name: Install API Gateway dependencies
      ansible.builtin.command: npm ci
      args:
        chdir: "{{ app_dir }}/ApiGateway"
        creates: "{{ app_dir }}/ApiGateway/node_modules"

    - name: Install frontend dependencies
      ansible.builtin.command: npm ci
      args:
        chdir: "{{ app_dir }}/FrontendApplication"
        creates: "{{ app_dir }}/FrontendApplication/node_modules"

    - name: Build frontend with same-origin API routing
      ansible.builtin.command: npm run build
      args:
        chdir: "{{ app_dir }}/FrontendApplication"
        creates: "{{ app_dir }}/FrontendApplication/dist/main.js"

    - name: Restore application ownership after build
      ansible.builtin.file:
        path: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        recurse: true

    - name: Publish frontend files
      ansible.builtin.copy:
        src: "{{ app_dir }}/FrontendApplication/dist/"
        dest: /var/www/html/
        remote_src: true
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Ensure NGINX document root is traversable
      ansible.builtin.file:
        path: /var/www/html
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Install systemd service definitions
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: '0644'
      loop:
        - { src: quote.service.j2, dest: /etc/systemd/system/quote.service }
        - { src: apigateway.service.j2, dest: /etc/systemd/system/apigateway.service }
      notify: Reload systemd

    - name: Configure NGINX
      ansible.builtin.template:
        src: vhost.conf.j2
        dest: /etc/nginx/sites-available/csci644.conf
        mode: '0644'
      notify: Restart NGINX

    - name: Enable required services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - mongod
        - redis-server
        - quote
        - apigateway
        - nginx

    - name: Remove default NGINX site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Restart NGINX

    - name: Enable Assignment 2 NGINX site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/csci644.conf
        dest: /etc/nginx/sites-enabled/csci644.conf
        state: link

    - name: Restart NGINX with the deployed routing configuration
      ansible.builtin.systemd:
        name: nginx
        state: restarted

    - name: Wait for MongoDB
      ansible.builtin.wait_for:
        port: 27017
        host: 127.0.0.1
        timeout: 60

    - name: Initialize MongoDB admin user once
      ansible.builtin.shell: mongosh --quiet < MongoDB/admin-init.js
      args:
        chdir: "{{ app_dir }}"
        creates: /var/lib/mongodb/.csci644-admin-initialized

    - name: Mark MongoDB admin initialization complete
      ansible.builtin.file:
        path: /var/lib/mongodb/.csci644-admin-initialized
        state: touch
        mode: '0600'

    - name: Run idempotent MongoDB seed script
      ansible.builtin.shell: >-
        mongosh --quiet --username {{ mongo_user }}
        --password {{ mongo_password }}
        --authenticationDatabase admin < MongoDB/init-db.js
      args:
        chdir: "{{ app_dir }}"

    - name: Wait for public application endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1/api/readyz
        status_code: 200
      register: readiness
      retries: 20
      delay: 5
      until: readiness.status == 200

    - name: Run final contract test suite
      ansible.builtin.command: make test-e2e BASE_URL=http://localhost
      args:
        chdir: "{{ app_dir }}"

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart NGINX
      ansible.builtin.systemd:
        name: nginx
        state: restarted
